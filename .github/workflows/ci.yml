name: CI

on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -uses: action/checkout@v4

      -uses: action/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

      -name: Build e testes
      run: mvn -B verify