services:
  app:
    build: ./api
    container_name: fintrack-back-end
    ports:
      - 8080:8080
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:18-alpine
    container_name: fintrack-db
    ports:
      - 5432:5432
    env_file:
      - ./api/.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge