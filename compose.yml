services:
  app:
    build: ./api
    container_name: fintrack-back-end
    ports:
      - 8080:8080
    env_file:
      - ./api/.env
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: fintrack-db
    ports:
      - 5342:5342
    env_file:
      - ./api/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge